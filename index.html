<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微星解密室 - 抽取話題卡</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
            /* 比照圖二：木地板與溫暖淺棕色背景 */
            background-color: #d6af84;
            background-image: 
                linear-gradient(rgba(140, 95, 55, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(140, 95, 55, 0.15) 1px, transparent 1px);
            background-size: 32px 32px;
            color: #4a3423;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-container {
            /* 溫暖木質卡片風格 */
            background-color: #f7ede2;
            border: 4px solid #8c5f37;
            box-shadow: 
                0 0 0 2px #f7ede2,
                0 0 0 6px #5c3a21,
                0 8px 20px rgba(74, 52, 35, 0.3);
            border-radius: 16px;
            padding: 32px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        h1 {
            color: #6b3e1e;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .subtitle {
            color: #8c6d53;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .topic-btn {
            background-color: #ffffff;
            color: #4a3423;
            border: 2px solid #b8936c;
            box-shadow: 0 4px 0 0 #b8936c;
            border-radius: 12px;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
        }

        .topic-btn:hover {
            background-color: #8c5f37;
            border-color: #5c3a21;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 0 #5c3a21;
        }

        .topic-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 #5c3a21;
        }

        .result-box {
            margin-top: 24px;
            padding: 20px;
            /* 比照圖二綠色沙發與木紋的和諧配色 */
            background-color: #e8f0e6;
            border: 2px dashed #52796f;
            border-radius: 12px;
            display: none;
            animation: popIn 0.3s ease-out forwards;
        }

        .result-title {
            color: #2f3e46;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-desc {
            color: #354f52;
            font-size: 15px;
            line-height: 1.6;
        }

        .highlight-topic {
            color: #d96b27;
            font-weight: bold;
        }

        .highlight-location {
            color: #8c5f37;
            font-weight: bold;
            background-color: #f7ede2;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #d6af84;
            display: inline-block;
            margin-top: 4px;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h1>🎲 微星解密室 - 抽取話題卡</h1>
        <p class="subtitle">請憑直覺選擇下方任一桌號進行抽卡：</p>

        <div class="btn-group">
            <button class="topic-btn" onclick="drawCard(1)">
                🪑 1 號桌 (點擊抽卡)
            </button>
            <button class="topic-btn" onclick="drawCard(2)">
                🪑 2 號桌 (點擊抽卡)
            </button>
            <button class="topic-btn" onclick="drawCard(3)">
                🪑 3 號桌 (點擊抽卡)
            </button>
        </div>

        <div id="resultBox" class="result-box">
            <div id="resultTitle" class="result-title"></div>
            <div id="resultDesc" class="result-desc"></div>
        </div>
    </div>

    <script>
        const cardsData = {
            1: {
                topic: "公司印象題",
                location: "左側圓桌沙發區"
            },
            2: {
                topic: "微星文化福利",
                location: "中間白桌沙發區"
            },
            3: {
                topic: "職涯交流題",
                location: "右側黑桌沙發區"
            }
        };

        function drawCard(cardNumber) {
            const card = cardsData[cardNumber];
            const resultBox = document.getElementById("resultBox");
            const resultTitle = document.getElementById("resultTitle");
            const resultDesc = document.getElementById("resultDesc");

            resultTitle.innerHTML = `🎉 你抽中了 <span class="highlight-topic">【${cardNumber}號桌：${card.topic}】</span>！`;
            resultDesc.innerHTML = `請前往 <span class="highlight-location">📍 ${card.location}</span> 踩點並抽卡分享！`;

            resultBox.style.display = "block";
        }
    </script>

</body>
</html>
