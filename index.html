<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微星解密室 - 抽取話題卡</title>
    <style>
        /* 載入像素風格字體 */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

        body {
            font-family: "Microsoft JhengHei", "VT323", monospace;
            /* 模擬 Gather 像素網格地磚背景 */
            background-color: #1a1a24;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-container {
            background-color: #242432;
            /* 像素風格厚重邊框 */
            border: 4px solid #ff2a2a;
            box-shadow: 
                0 0 0 4px #000000,
                0 8px 0 4px #101018,
                0 0 20px rgba(255, 42, 42, 0.3);
            border-radius: 8px;
            padding: 28px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        h1 {
            color: #ff3333;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 12px;
            text-shadow: 2px 2px #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .subtitle {
            color: #a0a0c0;
            font-size: 15px;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .topic-btn {
            background-color: #2c2d3f;
            color: #ffffff;
            border: 3px solid #4a4d68;
            box-shadow: 0 4px 0 0 #151622;
            border-radius: 6px;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            user-select: none;
        }

        .topic-btn:hover {
            background-color: #ff2a2a;
            border-color: #ffffff;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 0 #151622, 0 0 12px rgba(255, 42, 42, 0.6);
        }

        .topic-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 #151622;
        }

        .result-box {
            margin-top: 24px;
            padding: 18px;
            background-color: #161620;
            border: 3px dashed #00ff88;
            border-radius: 6px;
            display: none;
            box-shadow: inset 0 0 10px rgba(0, 255, 136, 0.1);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .result-title {
            color: #00ff88;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
        }

        .result-desc {
            color: #e0e0f0;
            font-size: 16px;
            line-height: 1.6;
        }

        .highlight-location {
            color: #ffcc00;
            font-weight: bold;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h1>🎲 微星解密室 - 抽取話題卡</h1>
        <p class="subtitle">請憑直覺選擇下方任一桌號進行抽卡：</p>

        <div class="btn-group">
            <button class="topic-btn" onclick="drawCard(1)">
                🔴 1 號桌 (點擊抽卡)
            </button>
            <button class="topic-btn" onclick="drawCard(2)">
                🟢 2 號桌 (點擊抽卡)
            </button>
            <button class="topic-btn" onclick="drawCard(3)">
                🟡 3 號桌 (點擊抽卡)
            </button>
        </div>

        <div id="resultBox" class="result-box">
            <div id="resultTitle" class="result-title"></div>
            <div id="resultDesc" class="result-desc"></div>
        </div>
    </div>

    <script>
        const cardsData = {
            1: {
                topic: "品牌印象",
                location: "左側紅桌沙發區"
            },
            2: {
                topic: "職涯與文化嚮往",
                location: "中間白桌沙發區"
            },
            3: {
                topic: "靈魂敲碗（發問 HR）",
                location: "右側黃桌沙發區"
            }
        };

        function drawCard(cardNumber) {
            const card = cardsData[cardNumber];
            const resultBox = document.getElementById("resultBox");
            const resultTitle = document.getElementById("resultTitle");
            const resultDesc = document.getElementById("resultDesc");

            resultTitle.innerHTML = `🎉 你抽中了【 ${cardNumber} 號桌：${card.topic} 】！`;
            resultDesc.innerHTML = `請前往 <span class="highlight-location">${card.location}</span> 踩點並開麥交流！`;

            resultBox.style.display = "block";
        }
    </script>

</body>
</html>
